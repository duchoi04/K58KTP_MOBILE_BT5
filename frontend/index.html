<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG GIÁM SÁT REALTIME</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #000000;
            text-transform: uppercase;
            font-size: 24px;
            margin-bottom: 30px;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
        .card h2 {
            margin: 0 0 15px 0;
            color: #333333;
            font-size: 20px;
        }
        .value {
            font-size: 42px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .status {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        .status.ok {
            background-color: #2ecc71;
            color: #ffffff;
        }
        .status.warning {
            background-color: #e67e22;
            color: #ffffff;
        }
        .status.danger {
            background-color: #e74c3c;
            color: #ffffff;
        }
        .time-label {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 15px;
        }
        iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            background: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Hệ thống giám sát thông số và cảnh báo thời gian thực</h1>

    <div class="container">
        <div class="card">
            <h2 id="metric-name">Đang kết nối luồng dữ liệu...</h2>
            <div class="value" id="metric-value">0.00</div>
            <div id="metric-status" class="status ok">NORMAL</div>
            <p class="time-label">Thời gian cập nhật: <span id="metric-time">-</span></p>
        </div>

        <iframe id="grafana-chart" src="http://192.168.1.125:3000/d-solo/adnqdth/new-dashboard?orgId=1&from=now-5m&to=now&panelId=1&theme=light"></iframe>
    </div>

    <script>
        function updateDashboard() {
            // Fetch API gọi đến backend Flask để lấy dữ liệu mới nhất từ MariaDB
            fetch('http://192.168.1.125:5000/api/realtime-value')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Mạng gặp sự cố khi kết nối API Flask');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data && data.current_value !== undefined) {
                        // Cập nhật Tên thông số, Giá trị thực và Thời gian
                        document.getElementById('metric-name').innerText = data.parameter_name;
                        document.getElementById('metric-value').innerText = parseFloat(data.current_value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        document.getElementById('metric-time').innerText = data.last_updated || new Date().toLocaleTimeString();

                        // Cập nhật đổi màu trạng thái cảnh báo linh hoạt
                        const statusElement = document.getElementById('metric-status');
                        statusElement.innerText = data.status;
                        
                        statusElement.className = 'status'; // Reset class mặc định
                        if (data.status === 'NORMAL') {
                            statusElement.classList.add('ok');
                        } else if (data.status.includes('LOW')) {
                            statusElement.classList.add('warning');
                        } else {
                            statusElement.classList.add('danger');
                        }
                    }
                })
                .catch(error => {
                    console.error('Lỗi fetch dữ liệu realtime:', error);
                });
        }

        // Tự động kích hoạt gọi API Flask cập nhật lại số liệu sau mỗi 2 giây
        setInterval(updateDashboard, 2000);
        // Chạy ngay lần đầu tiên khi vừa tải trang xong
        updateDashboard();
    </script>
</body>
</html>
